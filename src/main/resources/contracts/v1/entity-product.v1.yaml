# EntitySchema Contract - Product (RFC product-schema-dx-proposal)
# 올리브영 상품 RawData 구조. RuleSet이 실제 슬라이싱 규칙 정의.

kind: ENTITY_SCHEMA
id: entity.product.v1
version: 1.0.0
status: ACTIVE

entityType: PRODUCT

# View/Slice 설계용 (비즈니스 개념). Raw 검증은 RAW_SCHEMA 별도.
fields:
  - name: productId
    type: string
    required: true
    description: "상품 마스터 ID (uaCode)"
  - name: sku
    type: string
    required: false
    description: "바코드/SKU (masterInfo.gdsCd)"
  - name: name
    type: string
    required: true
    description: "상품명"
  - name: brand
    type: string
    required: false
    description: "브랜드"
  - name: salePrice
    type: long
    required: false
    description: "판매가"
  - name: saleStatus
    type: string
    required: false
    description: "판매 상태"

ruleSetRef:
  id: ruleset.product.oliveyoung.v1
  version: 1.0.0
