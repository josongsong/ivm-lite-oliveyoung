# RFC: Product RawData → IVM-Lite Contract (product-schema-dx-proposal)
# 올리브영 상품 RawData 스키마. UA30953620/UA11279226 구조 기준.

kind: RULESET
id: ruleset.product.oliveyoung.v1
version: 1.0.0
status: ACTIVE

entityType: PRODUCT

# 각 경로는 정확히 1개 Slice에만. 중복 제거.
impactMap:
  CORE:
    - "/uaCode"
    - "/_meta/*"
    - "/_audit/*"
    - "/masterInfo/gdsCd"
    - "/masterInfo/gdsNm"
    - "/masterInfo/gdsEngNm"
    - "/masterInfo/gaCode"
    - "/masterInfo/brand/*"
    - "/masterInfo/flags/*"
    - "/masterInfo/gdsStatNm"
    - "/masterInfo/buyTypNm"
    - "/masterInfo/gdsRegYmd"
    - "/masterInfo/supplier/*"
    - "/masterInfo/manufacturingCountry/*"
    - "/masterInfo/md/*"
    - "/masterInfo/scm/*"
    - "/masterInfo/boxDimensions/*"
    - "/masterInfo/productDimensions/*"
    - "/masterInfo/onyoneSpNm"
    - "/masterInfo/manBabySpNm"
    - "/masterInfo/poutTlmtDdNum"
    - "/masterInfo/validPrdDdNum"
    - "/masterInfo/infnSelImpsYnValue"
    - "/onlineInfo/prdtNo"
    - "/onlineInfo/prdtName"
    - "/onlineInfo/agoodsNo"
    - "/onlineInfo/onlinePrdtName"
    - "/onlineInfo/prdtStatCode"
    - "/onlineInfo/displayYn"
    - "/onlineInfo/prdtGbnCode"
    - "/onlineInfo/onlineBrand/*"
    - "/onlineInfo/onlineMd/*"
    - "/onlineInfo/aGoodsNm"
    - "/onlineInfo/prdtSbttlName"
    - "/onlineInfo/prdtGbnCodeName"
    - "/onlineInfo/prdtStatCodeName"
    - "/onlineInfo/sellStatCodeName"
    - "/onlineInfo/saleEndText"
    - "/onlineInfo/appExcluPrdtYn"
  PRICE:
    - "/options"
    - "/masterInfo/packaging/*"
  INVENTORY:
    - "/onlineInfo/orderQuantity/*"
    - "/onlineInfo/orderLimits/*"
    - "/onlineInfo/sellStatCode"
    - "/reservationSaleInfo/*"
    - "/shippingInfo/*"
    - "/options/*/existYn"
    - "/options/*/gdsStatCd"
  MEDIA:
    - "/thumbnailImages"
    - "/videoInfo/*"
    - "/detailThumbnails"
    - "/techSpecInfo/*"
    - "/options/*/optnImagePath"
    - "/options/*/colrChipImagePath1"
    - "/options/*/colrChipImagePath2"
    - "/options/*/colrChipImagePath3"
  CATEGORY:
    - "/displayCategories"
    - "/masterInfo/standardCategory/*"
  INDEX:
    - "/emblemInfo/*"
    - "/attributes"
    - "/colorChipUseYn"
    - "/additionalInfo/*"
    - "/languageDisplayList/*"
  NOTICE:
    - "/noticeInfo/*"
    - "/descriptionInfo/*"
    - "/globalInfo/*"
    - "/certifications/*"
    - "/safetyCertCategory/*"
  ASSOCIATED:
    - "/associatedProducts"
  ENRICHED:
    - "/masterInfo/brand/code"

slices:
  - type: CORE
    buildRules:
      type: PassThrough
      fields:
        - "uaCode"
        - "_meta"
        - "_audit"
        - "masterInfo.gdsCd"
        - "masterInfo.gdsNm"
        - "masterInfo.gdsEngNm"
        - "masterInfo.gaCode"
        - "masterInfo.brand"
        - "masterInfo.flags"
        - "masterInfo.gdsStatNm"
        - "masterInfo.buyTypNm"
        - "masterInfo.gdsRegYmd"
        - "masterInfo.supplier"
        - "masterInfo.manufacturingCountry"
        - "masterInfo.md"
        - "masterInfo.scm"
        - "masterInfo.boxDimensions"
        - "masterInfo.productDimensions"
        - "masterInfo.onyoneSpNm"
        - "masterInfo.manBabySpNm"
        - "masterInfo.poutTlmtDdNum"
        - "masterInfo.validPrdDdNum"
        - "masterInfo.infnSelImpsYnValue"
        - "onlineInfo.prdtNo"
        - "onlineInfo.prdtName"
        - "onlineInfo.agoodsNo"
        - "onlineInfo.onlinePrdtName"
        - "onlineInfo.prdtStatCode"
        - "onlineInfo.displayYn"
        - "onlineInfo.prdtGbnCode"
        - "onlineInfo.onlineBrand"
        - "onlineInfo.onlineMd"
        - "onlineInfo.aGoodsNm"
        - "onlineInfo.prdtSbttlName"
        - "onlineInfo.prdtGbnCodeName"
        - "onlineInfo.prdtStatCodeName"
        - "onlineInfo.sellStatCodeName"
        - "onlineInfo.saleEndText"
        - "onlineInfo.appExcluPrdtYn"
    joins: []
  - type: PRICE
    buildRules:
      type: PassThrough
      fields: ["options", "masterInfo.packaging"]
  - type: INVENTORY
    buildRules:
      type: PassThrough
      fields:
        - "onlineInfo.orderQuantity"
        - "onlineInfo.orderLimits"
        - "onlineInfo.sellStatCode"
        - "reservationSaleInfo"
        - "shippingInfo"
  - type: MEDIA
    buildRules:
      type: PassThrough
      fields: ["thumbnailImages", "videoInfo", "detailThumbnails", "techSpecInfo"]
  - type: CATEGORY
    buildRules:
      type: PassThrough
      fields: ["displayCategories", "masterInfo.standardCategory"]
  - type: INDEX
    buildRules:
      type: PassThrough
      fields: ["emblemInfo", "attributes", "colorChipUseYn", "additionalInfo", "languageDisplayList"]
  - type: NOTICE
    buildRules:
      type: PassThrough
      fields:
        - "noticeInfo"
        - "descriptionInfo"
        - "globalInfo"
        - "certifications"
        - "safetyCertCategory"
  - type: ASSOCIATED
    buildRules:
      type: PassThrough
      fields: ["associatedProducts"]
  - type: ENRICHED
    sliceKind: ENRICHMENT
    buildRules:
      type: PassThrough
      fields: []
    joins:
      - name: brand
        type: LOOKUP
        sourceFieldPath: masterInfo.brand.code
        targetEntityType: BRAND
        targetSliceType: SUMMARY
        targetKeyPattern: "BRAND#{tenantId}#{value}"
        required: false
        missingPolicy: PARTIAL_ALLOWED
        projection:
          mode: COPY_FIELDS
          fields:
            - from: name
              to: brandName
            - from: logoUrl
              to: brandLogoUrl

indexes:
  - type: brand
    selector: $.masterInfo.brand.code
    references: BRAND
    maxFanout: 10000
  - type: keyword
    selector: $.additionalInfo.srchKeyWordText
  - type: gtin
    selector: $.masterInfo.gdsCd
