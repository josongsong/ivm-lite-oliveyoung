# RFC product-schema-dx-proposal: OpenSearch Sink
# PRODUCT_SEARCH View 수준 slice set 전송

kind: SINK_RULE
id: sinkrule.opensearch.product
version: 1.0.0
status: ACTIVE

input:
  type: SLICE
  sliceTypes: [CORE, PRICE, CATEGORY, INDEX, MEDIA, INVENTORY, ENRICHED]
  entityTypes: [PRODUCT]

target:
  type: OPENSEARCH
  endpoint: ${OPENSEARCH_ENDPOINT:-http://localhost:9200}
  indexPattern: "ivm-products-{tenantId}"
  auth:
    type: BASIC
    username: ${OPENSEARCH_USERNAME:-}
    password: ${OPENSEARCH_PASSWORD:-}

docId:
  pattern: "{tenantId}__{entityKey}"

fieldMapping:
  enabled: false

commit:
  batchSize: 1000
  timeoutMs: 30000
